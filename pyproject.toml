[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex_workflow_demo"
version = "0.1.0"
description = "Uni-Lab-OS 复杂工作流演示设备包：for / while 循环容器（设备状态与节点返回值判定）驱动的多步流程"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["unilabos", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["complex_workflow_demo*"]

[tool.setuptools.data-files]
"share/complex_workflow_demo/graph" = ["graph/*.json"]
